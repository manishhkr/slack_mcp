services:
  - type: web
    name: slack-mcp
    env: python
    runtime: python3
    plan: free
    autoDeploy: true
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python fastmcp_slack.py
    envVars:
      - key: FASTMCP_HOST
        value: 0.0.0.0
      - key: DB_HOST
        value: <your-db-host>
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: slack
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      # Optional Slack Bot Token if needed
      # - key: SLACK_BOT_TOKEN
      #   sync: false
