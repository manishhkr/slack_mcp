services:
  - type: web
    name: slack-mcp
    env: python
    runtime: python3
    plan: free
    autoDeploy: true
    region: oregon
    disk: 1GB  # Required for persistent sessions
    buildCommand: pip install -r requirements.txt
    startCommand: python fastmcp_slack.py
    envVars:
      - key: FASTMCP_HOST
        value: 0.0.0.0
      # Optional: set default Slack bot token if you want
      # - key: SLACK_BOT_TOKEN
      #   sync: false
